<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10202A">
<title>Media Saver</title>
<style>
:root{--bg:#EEF2F0;--card:#fff;--ink:#16252E;--mute:#5D6F78;--line:#D0DAD7;--acc:#0B6E78;--onacc:#fff;--bad:#B3261E}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10202A;--card:#18303D;--ink:#E7EFF2;--mute:#9DB1BA;--line:#2A4755;--acc:#6DD3D8;--onacc:#0A2128;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.6rem;letter-spacing:-.02em;margin:0}
h2{font-size:1.05rem;margin:28px 0 10px}
#sheet h2{margin-top:0;font-size:1.2rem;overflow-wrap:anywhere}
p{margin:0 0 14px}
small{color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn:disabled{opacity:.6}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wide{display:block;width:100%;margin-top:12px}
input[type=url]{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit;margin-top:18px}
#sheet input[type=url]{margin:8px 0 18px}
.card,.dl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px}
.dl{display:flex;flex-direction:column;gap:4px;margin:0 0 10px}
.dl b{overflow-wrap:anywhere}
.dl .err{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{flex:1}
.split{justify-content:space-between;align-items:center;margin:14px 0}
.split .btn{flex:0 0 auto}
.empty{color:var(--mute);padding:8px 2px}
#wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
#wrap.open{display:flex}
#sheet{width:100%;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;overscroll-behavior:contain;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media(prefers-reduced-motion:reduce){#sheet{animation:none}}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.opt input{width:22px;height:22px;accent-color:var(--acc);margin:0}
.opt span{flex:1;font-weight:600}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));min-height:54px;padding:0 22px;border-radius:27px;border:0;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:10}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
</style>
</head>

(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIME={mp4:'video/mp4',mkv:'video/x-matroska',webm:'video/webm',mov:'video/quicktime',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',wav:'audio/wav',jpg:'image/jpeg',png:'image/png',pdf:'application/pdf',zip:'application/zip'};
const K='mediasaver.v1';
let S={backend:'',token:'',folder:'',useDl:false,items:[]},M=null,sel=0,once=null,pickOnce=false,sheetFn=null,isOpen=false,skip=0,tt;
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.items=(S.items||[]).map(i=>(i.status==='preparing'||i.status==='downloading')?Object.assign({},i,{status:'error',err:'Interrupted'}):i);
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(Object.assign({},S,{items:S.items.slice(0,30)})))}catch(e){}};

/* ---------- Android bridge (every call is safe) ---------- */
const hasBridge=()=>!!window.AndroidBridge;
function safeCall(m,p){
  try{
    const b=window.AndroidBridge;
    if(!b||typeof b[m]!=='function')return{ok:false,error:'unavailable'};
    const r=p===undefined?b[m]():b[m](JSON.stringify(p));
    let d=r;try{d=JSON.parse(r)}catch(e){}
    return{ok:true,data:d};
  }catch(e){return{ok:false,error:String(e)}}
}
const parse=r=>{try{return typeof r==='string'?JSON.parse(r):(r||{})}catch(e){return{}}};
function applyFolder(r,silent){
  const d=parse(r);if(!d.token)return;
  const name=d.name||d.path||'Selected folder';
  if(pickOnce){once={token:d.token,name};pickOnce=false}else{S.token=d.token;S.folder=name;S.useDl=false;persist()}
  if(!silent)toast('Folder: '+name);
  if(sheetFn===folderView)closeSheet();else draw();
}
window.onFolderPicked=r=>applyFolder(r);
window.onDownloadProgress=r=>{const d=parse(r),i=S.items.find(x=>x.id===d.id);if(i){i.status='downloading';i.pct=Math.max(0,Math.min(100,+d.percent||0));list()}};
window.onDownloadDone=r=>{
  const d=parse(r),i=S.items.find(x=>x.id===d.id);if(!i)return;
  if(d.ok===false){i.status='error';i.err=d.error||'Download failed'}
  else{i.status='done';i.pct=100;i.filePath=d.filePath||'';toast('Saved: '+i.fileName)}
  list();persist();
};

/* ---------- helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3400)}
const clean=n=>String(n).replace(/[\\\/:*?"<>|\u0000-\u001f]/g,'').replace(/\s+/g,' ').replace(/^\.+/,'').trim().slice(0,120)||'download';
function uniq(base,ext){const used=new Set(S.items.map(i=>i.fileName));let n=base+'.'+ext,k=0;while(used.has(n)){k++;n=base+' - '+k+'.'+ext}return n}
const fmt=b=>!b?'':b>1e9?(b/1e9).toFixed(1)+' GB':b>1e6?Math.round(b/1e6)+' MB':Math.round(b/1e3)+' KB';
async function space(n){if(!n)return true;try{const e=await navigator.storage.estimate();return !(e.quota&&e.quota-e.usage<n*1.1)}catch(x){return true}}
async function keepAwake(){try{const w=await navigator.wakeLock.request('screen');setTimeout(()=>{try{w.release()}catch(e){}},6e5);toast('Keeping the screen on while this downloads.')}catch(e){}}
function browserDownload(u,n){const a=document.createElement('a');a.href=u;a.download=n;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
async function api(path,body){
  const r=await fetch(S.backend.replace(/\/+$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('The server replied with error '+r.status+'.');
  return r.json();
}

/* ---------- bottom sheets (with Android back button support) ---------- */
function draw(){if(!sheetFn)return;$('#sheet').innerHTML=sheetFn();$('#wrap').classList.add('open')}
function openSheet(fn){sheetFn=fn;draw();if(!isOpen){isOpen=true;try{history.pushState({s:1},'')}catch(e){}}}
function closeSheet(pop){
  sheetFn=null;$('#wrap').classList.remove('open');
  if(isOpen){isOpen=false;if(!pop){try{skip++;history.back()}catch(e){skip--}}}
}
addEventListener('popstate',()=>{if(skip>0){skip--;return}closeSheet(true)});
const msg=(t,b)=>openSheet(()=>`<h2>${esc(t)}</h2><p>${esc(b)}</p><button class="btn pri wide" data-act="close">Got it</button>`);
const folderView=()=>`<h2>Choose where to save</h2><p>Pick a folder once. New downloads go there, and you can change it any time in Settings.</p><button class="btn pri wide" data-act="pickDef">Choose folder</button><button class="btn wide" data-act="useDl">Use Downloads</button>`;
const folderPrompt=()=>openSheet(folderView);
const folderRow=()=>hasBridge()
  ?`<div class="row split"><div><b>Save to</b><br><small>${esc((once&&once.name)||S.folder||'Downloads')}</small></div><button class="btn" data-act="pickOnce">Pick another</button></div>`
  :`<p><small>Files are saved to your browser’s Downloads folder.</small></p>`;
const optionsView=()=>`<h2>${esc(M.title)}</h2>${M.formats.map((f,i)=>`<label class="opt"><input type="radio" name="f" value="${i}"${i===sel?' checked':''}><span>${esc(f.label)} ${esc(f.ext.toUpperCase())}</span><small>${fmt(f.size)}</small></label>`).join('')}${folderRow()}<button class="btn pri wide" data-act="start">Download</button>`;
const settingsView=()=>`<h2>Settings</h2><label for="srv"><b>Server address</b></label><br><small>Needed for video pages and streams. Leave empty for direct file links.</small><input id="srv" type="url" placeholder="https://your-server.example.com" value="${esc(S.backend)}" autocomplete="off">${hasBridge()?`<div class="row split"><div><b>Default folder</b><br><small>${esc(S.folder||'Downloads')}</small></div><button class="btn" data-act="pickDef">Change</button></div>`:'<p><small>Files are saved to your browser’s Downloads folder.</small></p>'}<button class="btn pri wide" data-act="save">Save settings</button>`;
const openOptions=()=>{if(M)openSheet(optionsView)};

/* ---------- analyze & download ---------- */
function result(){$('#result').innerHTML=`<div class="card"><b>${esc(M.title)}</b><br><small>${M.formats.length} format${M.formats.length>1?'s':''} found</small><button class="btn wide" data-act="reopen">Choose quality</button></div>`}
async function analyze(){
  const url=$('#url').value.trim(),b=$('[data-act=analyze]');
  if(!/^https?:\/\//i.test(url))return msg('Check the link','Paste a full link that starts with http:// or https://.');
  b.disabled=true;b.textContent='Analyzing…';
  try{
    if(S.backend){M=await api('/analyze',{url});M.source=url}
    else{
      const path=url.split(/[?#]/)[0],ext=((path.match(/\.([a-z0-9]{2,4})$/i)||[])[1]||'').toLowerCase();
      if(!MIME[ext])return msg('Server needed','This looks like a web page, not a file. Add your server address in Settings to analyze video pages, or paste a direct file link such as .mp4 or .mp3.');
      let size=0;try{size=+(await fetch(url,{method:'HEAD'})).headers.get('content-length')||0}catch(e){}
      M={title:decodeURIComponent(path.split('/').pop()).replace(/\.[^.]+$/,'')||'Download',source:url,formats:[{id:'direct',label:'Original',ext,size,url}]};
    }
    if(!M.formats||!M.formats.length)throw new Error('No downloadable formats were found for this link.');
    M.title=M.title||'Download';
    M.formats=M.formats.map(f=>{const e=String(f.ext||'mp4').toLowerCase();return Object.assign({},f,{ext:e,label:f.label||e,mime:f.mime||MIME[e]||'application/octet-stream'})});
    sel=0;once=null;result();openOptions();
  }catch(e){msg('Could not analyze',(e&&e.message)||'Check the link and your connection, then try again.')}
  finally{b.disabled=false;b.textContent='Analyze'}
}
async function start(){
  const f=M.formats[sel],tok=(once&&once.token)||S.token;
  if(hasBridge()&&!tok&&!S.useDl)return folderPrompt();
  if(!(await space(f.size)))return msg('Not enough space','This file needs about '+fmt(f.size)+', but your device looks too full. Free up space and try again.');
  const name=uniq(clean(M.title+' - '+f.label),f.ext),id='d'+Date.now();
  const it={id,fileName:name,title:M.title,mime:f.mime,status:'downloading',pct:0,where:(once&&once.name)||S.folder||'Downloads'};
  S.items.unshift(it);once=null;closeSheet();list();persist();
  try{
    let u=f.url;
    if(f.stream||!u){it.status='preparing';list();const d=await api('/download',{url:M.source,formatId:f.id});u=d.fileUrl}
    u=new URL(u,S.backend||location.href).href;it.url=u;it.status='downloading';list();
    if(hasBridge()){
      let r=safeCall('startForegroundDownload',{id,url:u,fileName:name,mimeType:f.mime,title:M.title,directoryToken:tok});
      if(!r.ok)r=safeCall('saveFile',{id,url:u,fileName:name,mimeType:f.mime,headers:{},directoryToken:tok,directoryPath:''});
      if(r.ok)return;
    }
    if(f.size>3e8)keepAwake();
    browserDownload(u,name);it.status='sent';list();persist();
  }catch(e){it.status='error';it.err=(e&&e.message)||'Download failed';list();persist()}
}
function share(i){
  if(safeCall('shareFile',{filePath:i.filePath,mimeType:i.mime}).ok)return;
  try{navigator.share({title:i.title,url:i.url}).catch(()=>{})}
  catch(e){try{navigator.clipboard.writeText(i.url);toast('Link copied')}catch(x){}}
}
function pick(o){
  pickOnce=o;const r=safeCall('pickDownloadFolder');
  if(!r.ok){pickOnce=false;S.useDl=true;persist();toast('Folder picking isn’t available. Files go to Downloads.')}
  else if(r.data)applyFolder(r.data);
}

/* ---------- downloads list ---------- */
function status(i){
  if(i.status==='preparing')return'Preparing the file on the server…';
  if(i.status==='downloading')return(i.pct||0)+'% downloaded';
  if(i.status==='done')return'Saved to '+(i.filePath||i.where||'Downloads');
  if(i.status==='sent')return'Sent to your browser’s downloads';
  return'<span class="err">'+esc(i.err||'Failed')+'</span>';
}
function list(){
  $('#list').innerHTML=S.items.length?S.items.map(i=>{
    const busy=i.status==='preparing'||i.status==='downloading',fin=i.status==='done'||i.status==='sent';
    return`<li class="dl"><b>${esc(i.fileName)}</b><small>${i.status==='error'?status(i):esc(status(i))}</small>${busy?`<div class="bar"><i style="width:${i.pct||4}%"></i></div>`:''}${fin?`<div class="row">${hasBridge()&&i.status==='done'?`<button class="btn" data-act="open" data-id="${i.id}">Open file</button>`:''}<button class="btn" data-act="share" data-id="${i.id}">Share file</button></div>`:''}</li>`;
  }).join(''):'<li class="empty">Nothing yet. Paste a link above to start.</li>';
}

/* ---------- events ---------- */
function act(a,id){
  const it=S.items.find(x=>x.id===id);
  const map={
    close:()=>closeSheet(),analyze,start,reopen:openOptions,
    settings:()=>openSheet(settingsView),
    paste:async()=>{const u=$('#url');try{u.value=(await navigator.clipboard.readText()).trim()}catch(e){}u.focus();if(/^https?:\/\//i.test(u.value))analyze()},
    pickOnce:()=>pick(true),pickDef:()=>pick(false),
    useDl:()=>{S.useDl=true;persist();closeSheet()},
    save:()=>{S.backend=($('#srv').value||'').trim();persist();closeSheet();toast('Settings saved')},
    open:()=>{if(it&&!safeCall('openFile',{filePath:it.filePath,mimeType:it.mime}).ok)toast('Open it from your Downloads folder.')},
    share:()=>{if(it)share(it)}
  };
  if(map[a])map[a]();
}
document.addEventListener('click',e=>{
  if(e.target.id==='wrap')return closeSheet();
  const t=e.target.closest('[data-act]');if(t)act(t.dataset.act,t.dataset.id);
});
$('#sheet').addEventListener('change',e=>{if(e.target.name==='f')sel=+e.target.value});
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});

/* ---------- start-up ---------- */
list();
if(hasBridge()){
  const r=safeCall('getSavedDownloadFolder');if(r.ok&&r.data)applyFolder(r.data,true);
  if(!S.token&&!S.useDl)setTimeout(folderPrompt,400);
}
})();
</script>
</body>
</html>
